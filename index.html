<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue MIS - Wildlife Division TVM</title>
    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --success: #059669; --bg: #f1f5f9; --border: #475569; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        .login-screen { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .login-card { background: white; padding: 40px; border-radius: 16px; width: 340px; text-align: center; }
        .header { background: white; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 2px solid #e2e8f0; align-items: center; }
        .nav-bar { background: white; display: flex; gap: 25px; padding: 0 30px; border-bottom: 1px solid #cbd5e1; }
        .nav-item { padding: 15px 0; cursor: pointer; font-weight: 700; color: #64748b; border-bottom: 3px solid transparent; }
        .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .controls { display: flex; gap: 15px; background: #f8fafc; padding: 20px; border-radius: 10px; margin-bottom: 20px; align-items: flex-end; border: 1px solid #cbd5e1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; font-size: 13px; }
        th, td { border: 1px solid var(--border); padding: 8px; }
        th { background: #f1f5f9; text-align: center; font-weight: 800; }
        .head-row { background: #e2e8f0; font-weight: 900; }
        .subtotal-row { background: #f0fdf4; font-weight: 800; color: #166534; }
        .grand-total-row { background: #1e293b; color: white; font-weight: 900; }
        .num { text-align: right; font-family: 'monospace'; font-weight: 700; }
        .entry-row { display: grid; grid-template-columns: 1fr 200px; padding: 10px; border-bottom: 1px solid #f1f5f9; }
        input[readonly] { background-color: #e2e8f0; cursor: not-allowed; font-weight: bold; }
        input[type="number"], select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; }
        .btn { padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; width: 100%; margin-top: 20px; font-size: 18px; }
        .error-msg { color: red; font-size: 12px; margin-top: 5px; }
        @media print { .nav-bar, .controls, .header, .btn, .login-screen { display: none !important; } .container { margin: 0; width: 100%; } }
    </style>
</head>
<body>

<div id="login-gate" class="login-screen">
    <div class="login-card">
        <h2>Revenue MIS Login</h2>
        <input type="text" id="user-in" placeholder="Username" style="margin-bottom:10px; width:100%; padding:10px;">
        <input type="password" id="pass-in" placeholder="Password" style="margin-bottom:20px; width:100%; padding:10px;">
        <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button>
        <p id="login-err" style="color:red; margin-top:10px"></p>
    </div>
</div>

<div class="header">
    <div style="font-weight:800">Wildlife Division, Thiruvananthapuram</div>
    <div id="user-info">Office: <span id="current-user"></span> | <button onclick="location.reload()">Logout</button></div>
</div>

<div class="nav-bar">
    <div class="nav-item active" id="nav-entry" onclick="showView('entry')">DATA ENTRY</div>
    <div class="nav-item" id="nav-report" onclick="showView('report')">REVENUE REPORT</div>
    <div class="nav-item" id="nav-settings" style="display:none" onclick="showView('settings')">ADMIN SETTINGS</div>
</div>

<div class="container">
    <div id="view-entry" class="content-view">
        <div class="card">
            <h3 style="margin:0 0 15px">Monthly Data Entry</h3>
            <div class="controls" style="background: #fffbeb;">
                <div style="flex:1"><label>Entry Date</label><input type="text" id="display-today" readonly></div>
                <div style="flex:1"><label>Office</label><input type="text" id="entry-office" readonly></div>
                <div style="flex:2"><label>Reporting Period (Auto-calculated)</label><input type="text" id="entry-period-label" readonly></div>
            </div>
            <div id="form-container"></div>
            <div id="success-msg" style="display:none; padding:20px; background:#dcfce7; border:1px solid #166534; border-radius:8px; margin-top:20px; text-align:center;">
                <h4 style="color:#166534; margin:0">Data Updated Successfully!</h4>
                <p style="margin:5px 0">Note: You cannot Edit/Delete data. Only Admin can perform these actions.</p>
            </div>
            <button class="btn btn-success" id="submit-btn" onclick="submitData()">Finalize & Upload</button>
        </div>
    </div>

    <div id="view-report" class="content-view" style="display:none">
        <div class="card">
            <div class="controls">
                <div style="flex:1"><label>Financial Year</label>
                    <select id="rep-fy">
                        <option value="2025-2026">2025-2026</option>
                        <option value="2026-2027">2026-2027</option>
                    </select>
                </div>
                <div style="flex:1"><label>Office</label><select id="rep-office-sel"></select></div>
                <div style="flex:1"><label>Report Month</label>
                    <select id="rep-month">
                        <option value="0">April</option><option value="1">May</option><option value="2">June</option>
                        <option value="3">July</option><option value="4">August</option><option value="5">September</option>
                        <option value="6">October</option><option value="7">November</option><option value="8">December</option>
                        <option value="9">January</option><option value="10">February</option><option value="11">March</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="generateReport()">Show Report</button>
                <button class="btn" style="background:#475569; color:white" onclick="window.print()">Print</button>
            </div>
            <div id="print-area">
                <div style="text-align:center">
                    <h3 style="margin:0">Proforma for Collection of Revenue</h3>
                    <p id="report-period-text" style="font-weight:bold; color:var(--accent)"></p>
                </div>
                <table id="report-table"></table>
            </div>
        </div>
    </div>

    <div id="view-settings" class="content-view" style="display:none">
        <div class="card">
            <h3>Admin Settings</h3>
            <label>Offices</label><textarea id="set-offices" style="width:100%; height:80px; margin-bottom:15px;"></textarea>
            <label>Revenue Heads</label><textarea id="set-heads" style="width:100%; height:300px;"></textarea>
            <button class="btn btn-primary" onclick="saveSettings()">Save Configuration</button>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtIjuArHBGUCbxQMYgymmoaqkbAqkc1CNLvY7H9w9jJcsm1huCB5w8DBdBwpw8qtoI/exec"; 
    let heads = ["0406-01-101-94", "Compounding fee-Kottoor", "Ground Rent", "0406-01-800-95", "Camera Fee"];
    let offices = ["KOTTOOR", "NEYYAR", "PEPPARA"];
    let userRole = "";

    function handleLogin() {
        const u = document.getElementById('user-in').value.trim().toUpperCase();
        const p = document.getElementById('pass-in').value;
        if(u === 'ADMIN' && p === 'admin123') userRole = 'admin';
        else if(offices.includes(u) && p === 'pass123') userRole = 'office';
        else { document.getElementById('login-err').innerText = "Login Failed"; return; }
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('current-user').innerText = u;
        if(userRole === 'admin') document.getElementById('nav-settings').style.display = 'block';
        initApp(u);
    }

    function initApp(u) {
        if(localStorage.getItem('sys_offices')) offices = JSON.parse(localStorage.getItem('sys_offices'));
        if(localStorage.getItem('sys_heads')) heads = JSON.parse(localStorage.getItem('sys_heads'));
        
        // --- CALCULATION LOGIC FOR AUTO PERIOD ---
        const today = new Date();
        const day = today.getDate();
        const jsMonth = today.getMonth(); // 0-11 (Jan-Dec)
        const year = today.getFullYear();
        
        let startD, endD, rMonth, rYear;
        
        // Fiscal Year logic: April-March
        // FY 2025-2026 means April 2025 to March 2026
        
        if (day <= 15) {
            // Days 1-15 of current day -> Report period is 16th-End of PREVIOUS calendar month
            const prevMonthDate = new Date(year, jsMonth, 0); // Last day of prev month
            const prevMonthNum = jsMonth === 0 ? 11 : jsMonth - 1; // If Jan, prev is Dec
            const prevMonthYear = jsMonth === 0 ? year - 1 : year;
            
            startD = `16/${String(jsMonth + 1).padStart(2,'0')}/${year}`;
            endD = `${prevMonthDate.getDate()}/${String(jsMonth + 1).padStart(2,'0')}/${year}`;
            
            // Calculate fiscal month (0=Apr, 1=May, ..., 11=Mar)
            rMonth = (jsMonth + 9) % 12;
            rYear = jsMonth >= 3 ? year : year - 1; // FY start year
            
        } else {
            // Days 16-31 of current day -> Report period is 1st-15th of NEXT calendar month
            const nextMonthNum = jsMonth + 1;
            startD = `01/${String(nextMonthNum + 1).padStart(2,'0')}/${year}`;
            endD = `15/${String(nextMonthNum + 1).padStart(2,'0')}/${year}`;
            
            // Calculate fiscal month
            rMonth = (nextMonthNum + 9) % 12;
            rYear = nextMonthNum >= 3 ? year : year - 1; // FY start year
        }

        document.getElementById('display-today').value = today.toLocaleDateString('en-GB');
        document.getElementById('entry-office').value = u;
        document.getElementById('entry-period-label').value = `${startD} to ${endD}`;
        document.getElementById('entry-period-label').dataset.m = rMonth;
        document.getElementById('entry-period-label').dataset.y = rYear;

        const oSel = document.getElementById('rep-office-sel');
        oSel.innerHTML = (userRole === 'admin') ? '<option value="DIVISION">DIVISION CONSOLIDATED</option>' : '';
        offices.forEach(o => { if(userRole === 'admin' || o === u) oSel.add(new Option(o, o)); });
        renderForm();
    }

    function renderForm() {
        const container = document.getElementById('form-container');
        container.innerHTML = "";
        heads.forEach(h => {
            const div = document.createElement('div');
            if(h.startsWith('0406')) {
                div.className = "entry-row head-row";
                div.innerHTML = `<span>${h}</span><span></span>`;
            } else {
                div.className = "entry-row";
                div.innerHTML = `<span>${h}</span><input type="number" class="val-in" data-h="${h}" value="0" min="0" step="0.01">`;
            }
            container.appendChild(div);
        });
    }

    async function submitData() {
        // Validation
        const confirmSave = confirm("Do you want to save Data?\n\nIf saved, data could not be edited or deleted by you.");
        if(!confirmSave) return;

        const btn = document.getElementById('submit-btn');
        btn.innerText = "Saving..."; 
        btn.disabled = true;

        const packet = [];
        let hasValidData = false;
        
        document.querySelectorAll('.val-in').forEach(i => {
            const amount = parseFloat(i.value) || 0;
            if(amount > 0) {
                hasValidData = true;
                
                // Determine if entry is 1st-15th or 16th-End
                const period = document.getElementById('entry-period-label').value;
                const half = period.includes("01/") ? 1 : 2;
                
                packet.push({
                    office: document.getElementById('entry-office').value,
                    period: period,
                    month: parseInt(document.getElementById('entry-period-label').dataset.m),
                    year: parseInt(document.getElementById('entry-period-label').dataset.y),
                    head: i.dataset.h, 
                    amount: amount,
                    half: half
                });
            }
        });

        if(!hasValidData) {
            alert("No valid data to save. Please enter amounts greater than 0.");
            btn.disabled = false;
            btn.innerText = "Finalize & Upload";
            return;
        }

        try {
            const response = await fetch(SCRIPT_URL, { 
                method: 'POST', 
                body: JSON.stringify(packet) 
            });
            const result = await response.text();
            
            if(result === "Success") {
                document.getElementById('form-container').style.opacity = "0.3";
                document.getElementById('form-container').style.pointerEvents = "none";
                document.getElementById('success-msg').style.display = "block";
                btn.style.display = "none";
            } else {
                alert("Error: " + result);
                btn.disabled = false;
                btn.innerText = "Finalize & Upload";
            }
        } catch(e) { 
            alert("Save failed: " + e.message); 
            btn.disabled = false;
            btn.innerText = "Finalize & Upload";
        }
    }

    async function generateReport() {
        const table = document.getElementById('report-table');
        const selMonth = parseInt(document.getElementById('rep-month').value); // 0-11 (Apr-Mar)
        const office = document.getElementById('rep-office-sel').value;
        const fy = document.getElementById('rep-fy').value;
        
        table.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:50px;'>Calculating for FY "+fy+"...</td></tr>";

        try {
            const resp = await fetch(SCRIPT_URL);
            const raw = await resp.json();
            
            let html = `<thead><tr><th rowspan="2">Head of Account</th><th rowspan="2">Revenue Previous (1)</th><th colspan="2">Collection Month</th><th rowspan="2">Total (2)</th><th rowspan="2">Grand Total</th></tr><tr><th>1st-15th</th><th>16th-End</th></tr></thead><tbody>`;

            const startYear = parseInt(fy.split("-")[0]);
            const endYear = parseInt(fy.split("-")[1]);

            let gPrev = 0, gH1 = 0, gH2 = 0, gMonth = 0, gTotal = 0;
            let sPrev = 0, sH1 = 0, sH2 = 0, sMonth = 0, sTotal = 0;
            let firstHead = true;

            heads.forEach((h, index) => {
                if (h.startsWith('0406')) {
                    if (!firstHead) {
                        html += renderRow("Sub Total", sPrev, sH1, sH2, sMonth, sTotal, "subtotal-row");
                        sPrev = 0; sH1 = 0; sH2 = 0; sMonth = 0; sTotal = 0;
                    }
                    html += `<tr class="head-row"><td colspan="6">${h}</td></tr>`;
                    firstHead = false;
                } else {
                    let p = 0, h1 = 0, h2 = 0;
                    
                    raw.slice(1).forEach(r => {
                        const rOffice = r[1];
                        const rPeriod = r[2];
                        const rMonth = parseInt(r[3]); // Fiscal month 0-11
                        const rYear = parseInt(r[4]);  // FY start year
                        const rHead = r[5];
                        const rAmount = parseFloat(r[6]);
                        const rHalf = parseInt(r[7]);  // 1 or 2
                        
                        // Check if record matches FY and filters
                        const isCorrectFY = (rYear === startYear);
                        const isCorrectOffice = (office === "DIVISION" || rOffice === office);
                        const isCorrectHead = (rHead === h);
                        
                        if (isCorrectFY && isCorrectOffice && isCorrectHead) {
                            // Progressive: sum all months BEFORE selected month
                            if (rMonth < selMonth) {
                                p += rAmount;
                            } 
                            // Current month split by half
                            else if (rMonth === selMonth) {
                                if (rHalf === 1) {
                                    h1 += rAmount; // 1st-15th
                                } else {
                                    h2 += rAmount; // 16th-End
                                }
                            }
                        }
                    });
                    
                    let mTotal = h1 + h2;
                    let rTotal = p + mTotal;
                    html += renderRow(h, p, h1, h2, mTotal, rTotal, "");
                    sPrev += p; sH1 += h1; sH2 += h2; sMonth += mTotal; sTotal += rTotal;
                    gPrev += p; gH1 += h1; gH2 += h2; gMonth += mTotal; gTotal += rTotal;
                }
                
                if (index === heads.length - 1) {
                    html += renderRow("Sub Total", sPrev, sH1, sH2, sMonth, sTotal, "subtotal-row");
                }
            });
            
            html += renderRow("GRAND TOTAL", gPrev, gH1, gH2, gMonth, gTotal, "grand-total-row");
            table.innerHTML = html + "</tbody>";
            
            const monthNames = ["April", "May", "June", "July", "August", "September", "October", "November", "December", "January", "February", "March"];
            document.getElementById('report-period-text').innerText = 
                `Month: ${monthNames[selMonth]} (FY ${fy})`;
        } catch(e) { 
            table.innerHTML = "<tr><td colspan='6' style='text-align:center; color:red;'>Error: " + e.message + "</td></tr>"; 
        }
    }

    function renderRow(label, col1, col2, col3, colMonth, colTotal, css) {
        return `<tr class="${css}"><td>${label}</td><td class="num">${col1.toFixed(2)}</td><td class="num">${col2.toFixed(2)}</td><td class="num">${col3.toFixed(2)}</td><td class="num">${colMonth.toFixed(2)}</td><td class="num">${colTotal.toFixed(2)}</td></tr>`;
    }

    function showView(v) {
        document.querySelectorAll('.content-view').forEach(e => e.style.display='none');
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        document.getElementById('view-'+v).style.display='block';
        document.getElementById('nav-'+v).classList.add('active');
        if(v === 'settings') { 
            document.getElementById('set-offices').value = offices.join("\n"); 
            document.getElementById('set-heads').value = heads.join("\n"); 
        }
    }

    function saveSettings() {
        offices = document.getElementById('set-offices').value.split("\n").filter(x => x.trim());
        heads = document.getElementById('set-heads').value.split("\n").filter(x => x.trim());
        localStorage.setItem('sys_offices', JSON.stringify(offices));
        localStorage.setItem('sys_heads', JSON.stringify(heads));
        alert("Settings Saved!"); 
        location.reload();
    }
</script>
</body>
</html>
